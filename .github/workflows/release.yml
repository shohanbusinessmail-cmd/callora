name: Callora Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark GitHub Release as pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-and-release:
    name: Verify, Build & Package Release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run full verification suite before packaging
        run: ./gradlew :core:model:test :core:common:test testDebugUnitTest lintDebug --stacktrace

      - name: Materialize external release keystore if configured in GitHub Secrets
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.CALLORA_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.CALLORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CALLORA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.CALLORA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "${RUNNER_TEMP}/callora-release.jks"
            echo "CALLORA_KEYSTORE_PATH=${RUNNER_TEMP}/callora-release.jks" >> "$GITHUB_ENV"
            echo "CALLORA_KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> "$GITHUB_ENV"
            echo "CALLORA_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "CALLORA_KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No release signing secrets configured; building unsigned release artifacts + debug APK."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug & Release APK + AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Collect artifacts & compute SHA-256 checksums
        run: |
          mkdir -p release-dist
          cp app/build/outputs/apk/debug/*.apk release-dist/
          cp app/build/outputs/apk/release/*.apk release-dist/
          cp app/build/outputs/bundle/release/*.aab release-dist/
          cd release-dist && sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/callora-release.jks"

      - name: Publish GitHub Release (Tag Push Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') || steps.signing.outputs.signed != 'true' }}
          body: |
            ### Callora ${{ github.ref_name }}
            - **Signing status:** `${{ steps.signing.outputs.signed == 'true' && 'Signed with configured release keystore' || 'Unsigned release artifacts (configure CALLORA_KEYSTORE_* secrets for Play/production signing) + installable debug APK' }}`
            - **Checksums:** Verify downloaded files against `SHA256SUMS.txt`.
            - **Important Carrier Notice:** Call forwarding (`CFNRc` `62`, `CFB` `67`, `CFNRy` `61`, `CFU` `21`) is executed by your mobile network operator after configuration while your phone has power and signal. Verify forwarding status on your physical SIM before relying on it for critical calls.
