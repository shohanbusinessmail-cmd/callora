androidxDataStore = "1.1.1"
androidxRoom = "2.6.1"
androidxWork = "2.10.0"
androidxWindow = "1.3.0"
composeBom = "2024.12.01"
material = "1.12.0"

coroutines = "1.9.0"

junit4 = "4.13.2"
androidxTestCore = "1.6.1"
androidxTestExtJunit = "1.2.1"
robolectric = "4.14.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidxCore" }
